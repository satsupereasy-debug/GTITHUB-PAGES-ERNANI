<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seleção de Imagens</title>
<style>
  :root {
    --bg:      #f4f2ee;
    --surface: #ffffff;
    --border:  #d8d4cd;
    --ink:     #1a1916;
    --ink2:    #4a4742;
    --ink3:    #8a8680;
    --accent:  #1a3a2a;
    --aclt:    #d6ead0;
    --red:     #b52020;
    --red-lt:  #fde8e8;
    --radius:  8px;
    --font:    'Segoe UI', system-ui, sans-serif;
    --mono:    'Consolas', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 2rem;
    width: 100%;
    max-width: 720px;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.3rem;
    letter-spacing: -0.01em;
  }
  .card-sub {
    font-size: 0.8rem;
    color: var(--ink3);
    margin-bottom: 1.5rem;
  }

  /* ── CONTADOR DE SELEÇÃO ── */
  .selecao-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .selecao-count {
    font-size: 0.78rem;
    font-family: var(--mono);
    color: var(--ink3);
  }
  .selecao-count span {
    color: var(--accent);
    font-weight: 700;
  }
  .btn-limpar {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--ink3);
    cursor: pointer;
    font-family: var(--font);
    text-decoration: underline;
    padding: 0;
  }
  .btn-limpar:hover { color: var(--red); }

  /* ── GRID DE OPÇÕES ── */
  .opcoes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .opcao { position: relative; cursor: pointer; }

  /* Esconde o checkbox nativo */
  .opcao input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }

  .opcao-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    transition: all 0.15s;
    background: var(--bg);
    user-select: none;
  }
  .opcao-inner:hover {
    border-color: var(--accent);
    background: #f0f5f0;
  }

  /* Selecionado */
  .opcao input[type="checkbox"]:checked + .opcao-inner {
    border-color: var(--accent);
    background: var(--aclt);
    box-shadow: 0 0 0 3px rgba(26,58,42,0.15);
  }

  /* Checkbox customizado no canto superior direito */
  .chk-box {
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    width: 20px; height: 20px;
    border-radius: 4px;
    border: 2px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    font-size: 12px;
    color: transparent;
  }
  .opcao input[type="checkbox"]:checked + .opcao-inner .chk-box {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Imagem */
  .opcao-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    transition: transform 0.15s;
  }
  .opcao:hover .opcao-img { transform: scale(1.02); }

  /* Label */
  .opcao-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--ink2);
    text-align: center;
  }
  .opcao input[type="checkbox"]:checked + .opcao-inner .opcao-label {
    color: var(--accent);
    font-weight: 600;
  }

  /* ID */
  .opcao-id {
    font-size: 0.65rem;
    font-family: var(--mono);
    color: var(--ink3);
    text-align: center;
  }

  /* ── RESUMO DA SELEÇÃO ── */
  .selecao-resumo {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.65rem 0.9rem;
    margin-bottom: 1.25rem;
    font-size: 0.78rem;
    font-family: var(--mono);
    color: var(--ink3);
    min-height: 2.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .tag {
    background: var(--aclt);
    color: var(--accent);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 0.72rem;
    font-weight: 600;
  }

  /* ── BOTÃO ENVIAR ── */
  .footer-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn-enviar {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    font-family: var(--font);
    padding: 0.6rem 1.75rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-enviar:hover  { background: #0f2518; }
  .btn-enviar:active { transform: scale(0.98); }
  .btn-enviar:disabled {
    background: var(--border);
    color: var(--ink3);
    cursor: not-allowed;
  }

  /* ── STATUS ── */
  #status {
    font-size: 0.8rem;
    font-family: var(--mono);
    padding: 0.4rem 0.75rem;
    border-radius: 4px;
    display: none;
  }
  #status.ok   { background: var(--aclt);   color: var(--accent); display: block; }
  #status.erro { background: var(--red-lt); color: var(--red);    display: block; }
  #status.info { background: #e8f0fe;       color: #1a4085;       display: block; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 1.5rem; right: 1.5rem;
    background: var(--ink);
    color: #fff;
    font-size: 0.85rem;
    padding: 0.65rem 1.1rem;
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    max-width: 300px;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.ok   { background: var(--accent); }
  #toast.erro { background: var(--red); }

  @media (max-width: 500px) {
    .opcoes-grid { grid-template-columns: 1fr; }
    .card { padding: 1.25rem; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-title">Selecione as imagens</div>
  <div class="card-sub">Você pode selecionar uma ou mais opções</div>

  <!-- Contador -->
  <div class="selecao-info">
    <div class="selecao-count"><span id="count">0</span> selecionada(s)</div>
    <button class="btn-limpar" onclick="limparSelecao()">Limpar seleção</button>
  </div>

  <!-- Grid de checkboxes -->
  <div class="opcoes-grid">

    <!-- OPÇÃO 1 -->
    <label class="opcao">
      <input type="checkbox" value="imagem_1" onchange="atualizarUI()"/>
      <div class="opcao-inner">
        <div class="chk-box">✓</div>
        <img class="opcao-img" src="images/imagem1.jpg" alt="Imagem 1"
             onerror="this.src='https://placehold.co/300x225/f4f2ee/8a8680?text=Imagem+1'"/>
        <span class="opcao-label">Opção 1</span>
        <span class="opcao-id">imagem_1</span>
      </div>
    </label>

    <!-- OPÇÃO 2 -->
    <label class="opcao">
      <input type="checkbox" value="imagem_2" onchange="atualizarUI()"/>
      <div class="opcao-inner">
        <div class="chk-box">✓</div>
        <img class="opcao-img" src="images/imagem2.jpg" alt="Imagem 2"
             onerror="this.src='https://placehold.co/300x225/f4f2ee/8a8680?text=Imagem+2'"/>
        <span class="opcao-label">Opção 2</span>
        <span class="opcao-id">imagem_2</span>
      </div>
    </label>

    <!-- OPÇÃO 3 -->
    <label class="opcao">
      <input type="checkbox" value="imagem_3" onchange="atualizarUI()"/>
      <div class="opcao-inner">
        <div class="chk-box">✓</div>
        <img class="opcao-img" src="images/imagem3.jpg" alt="Imagem 3"
             onerror="this.src='https://placehold.co/300x225/f4f2ee/8a8680?text=Imagem+3'"/>
        <span class="opcao-label">Opção 3</span>
        <span class="opcao-id">imagem_3</span>
      </div>
    </label>

  </div>
<!-- Fim Grid de checkboxes -->


  <!-- Resumo da seleção -->
  <div class="selecao-resumo" id="resumo">
    <span style="color:var(--ink3)">Nenhuma imagem selecionada</span>
  </div>

  <!-- Ações -->
  <div class="footer-actions">
    <button class="btn-enviar" id="btn-enviar" onclick="enviar()" disabled>
      ↗ Enviar seleção
    </button>
    <span id="status"></span>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ── CONFIG ── */
  const WEBHOOK_URL = 'https://SEU-TUNEL.ngrok-free.app/webhook';

  /* ── ATUALIZA UI (contador + resumo + botão) ── */
  function atualizarUI() {
    const checks   = [...document.querySelectorAll('input[type="checkbox"]:checked')];
    const valores  = checks.map(c => c.value);
    const count    = valores.length;

    // Contador
    document.getElementById('count').textContent = count;

    // Resumo com tags
    const resumo = document.getElementById('resumo');
    if (count === 0) {
      resumo.innerHTML = '<span style="color:var(--ink3)">Nenhuma imagem selecionada</span>';
    } else {
      resumo.innerHTML = valores.map(v =>
        `<span class="tag">${v}</span>`
      ).join('');
    }

    // Botão só ativo se houver seleção
    document.getElementById('btn-enviar').disabled = count === 0;

    // Limpa status anterior
    mostrarStatus('', '');
  }

  /* ── LIMPAR SELEÇÃO ── */
  function limparSelecao() {
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    atualizarUI();
  }

  /* ── ENVIAR ── */
  async function enviar() {
    const checks  = [...document.querySelectorAll('input[type="checkbox"]:checked')];
    const valores = checks.map(c => c.value);

    if (valores.length === 0) {
      mostrarStatus('Selecione ao menos uma imagem.', 'info');
      return;
    }

    const btn = document.getElementById('btn-enviar');
    btn.disabled    = true;
    btn.textContent = '⏳ Enviando…';
    mostrarStatus('', '');

    const payload = {
      imagens:   valores,          // array com todos os selecionados
      total:     valores.length,
      timestamp: new Date().toISOString(),
    };

    try {
      const res = await fetch(WEBHOOK_URL, {
        method:  'POST',
        headers: {
          'Content-Type':               'application/json',
          'ngrok-skip-browser-warning': 'true',
        },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        const msg = `✓ Enviado! ${valores.length} imagem(ns): ${valores.join(', ')}`;
        mostrarStatus(msg, 'ok');
        toast('Enviado com sucesso!', 'ok');
      } else {
        throw new Error('HTTP ' + res.status);
      }

    } catch(e) {
      mostrarStatus('✕ Erro: ' + e.message, 'erro');
      toast('Erro ao enviar', 'erro');
    } finally {
      btn.disabled    = false;
      btn.textContent = '↗ Enviar seleção';
      atualizarUI();
    }
  }

  /* ── STATUS ── */
  function mostrarStatus(msg, tipo) {
    const el     = document.getElementById('status');
    el.textContent = msg;
    el.className   = tipo;
  }

  /* ── TOAST ── */
  function toast(msg, tipo = '') {
    const el    = document.getElementById('toast');
    el.textContent = msg;
    el.className   = 'show ' + tipo;
    setTimeout(() => { el.className = tipo; }, 3000);
  }
</script>
</body>
</html>
