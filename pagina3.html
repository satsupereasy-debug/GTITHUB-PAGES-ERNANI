<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seleção — Página 3</title>
<link rel="stylesheet" href="shared.css"/>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Seleção de itens</span>
  <a class="topbar-badge" href="resumo.html">
    🛒 Ver seleção
    <span class="badge-count" id="badge-count">0</span>
  </a>
</div>

<div class="page-nav">
  <a class="page-nav-item" href="pagina1.html">① Página 1</a>
  <span class="page-nav-sep">›</span>
  <a class="page-nav-item" href="pagina2.html">② Página 2</a>
  <span class="page-nav-sep">›</span>
  <a class="page-nav-item active" href="pagina3.html">③ Página 3</a>
  <span class="page-nav-sep">›</span>
  <a class="page-nav-item" href="resumo.html">✓ Resumo</a>
</div>

<div class="content">
  <div class="page-title">Página 3 — Itens 7 a 9</div>
  <div class="page-sub">Selecione os itens e escolha a quantidade</div>

  <div class="itens-grid">

    <!-- ITEM 7 -->
    <label class="item-card">
      <input type="checkbox" value="item_7"
             onchange="toggleItem('item_7','Item 7',3,this.checked,
               this.closest('.item-card').querySelector('.qty-select').value);
               toast(this.checked ? '✓ Item 7 adicionado' : 'Item 7 removido')"/>
      <div class="item-inner">
        <div class="chk-box">✓</div>
        <img class="item-img" src="images/item7.jpg" alt="Item 7"
             onerror="this.src='https://placehold.co/300x225/f4f2ee/8a8680?text=Item+7'"/>
        <span class="item-label">Item 7</span>
        <span class="item-id">item_7</span>
        <div class="qty-wrap">
          <span class="qty-label">Qtd:</span>
          <select class="qty-select"
                  onchange="atualizarQty('item_7','Item 7',3,this.value)"
                  onclick="event.stopPropagation()">
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option>
          </select>
        </div>
      </div>
    </label>

    <!-- ITEM 8 -->
    <label class="item-card">
      <input type="checkbox" value="item_8"
             onchange="toggleItem('item_8','Item 8',3,this.checked,

        <div class="qty-wrap">

          <select class="qty-select"

                  onclick="event.stopPropagation()">
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option>
          </select>
        </div>
      </div>
    </label>

        <span class="item-label">Item 9</span>

          </select>
        </div>
      </div>
    </label>

  </div>

  <div class="nav-footer">
    <a class="btn btn-secondary" href="pagina2.html">‹ Página anterior</a>
    <a class="btn btn-primary"   href="resumo.html">Ver resumo ›</a>

</div>
